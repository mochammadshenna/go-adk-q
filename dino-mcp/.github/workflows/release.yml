# Release — dino-mcp
#
# Tags: v* (e.g. v1.0.0)
# Builds binaries for macOS (arm64 + amd64) and Linux (amd64 + arm64),
# bundles them as a GitHub release with release notes.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        run: make build-ui

      - name: Build binaries
        run: |
          for os in darwin linux; do
            for arch in arm64 amd64; do
              echo "=== $os/$arch ==="
              GOOS=$os GOARCH=$arch go build \
                -ldflags="-X github.com/msw/dino-mcp/internal/server.Version=${GITHUB_REF_NAME}" \
                -o dist/dino-mcp-$os-$arch ./cmd/dino-mcp
            done
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dino-mcp-*
          generate_release_notes: true
